name: Create release
run-name: Release ${{ inputs.release_type == 'custom' && inputs.custom_version || inputs.release_type }}

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release to build (base: the version in package.json)'
        type: choice
        default: patch
        options: [patch, minor, major, custom]
      custom_version:
        description: "Version to release (only used when release_type is 'custom', e.g. 1.2.3)"
        type: string
        required: false
      draft_release:
        description: 'Create the GitHub release as a draft'
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Version bump (package.json, lockfile, Helm chart + its README), changelog,
  # multi-arch image push to Docker Hub with provenance, push and GitHub release.
  release:
    uses: m13tLabs/gh-actions-templates/.github/workflows/docker-release.yml@main
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    with:
      images: '["docker.io/continuoussecuritytooling/keycloak-reporting-cli"]'
      client_id: ${{ vars.CI_CLIENT_ID }}
      release_type: ${{ inputs.release_type }}
      custom_version: ${{ inputs.custom_version }}
      default_branch: develop
      version_file: package.json
      dockerhub: true
      draft_release: ${{ inputs.draft_release }}
      # Lockfile version, chart patch bump + appVersion, regenerated chart README.
      bump_command: |
        npm version --no-git-tag-version --allow-same-version "$RELEASE_VERSION" >/dev/null
        chart=charts/keycloak-reporter/Chart.yaml
        current=$(sed -n -E 's/^version: *([0-9]+\.[0-9]+\.[0-9]+) *$/\1/p' "$chart")
        IFS=. read -r major minor patch <<< "$current"
        next="${major}.${minor}.$((patch + 1))"
        sed -i -E "s/^version: .*/version: ${next}/; s/^appVersion: .*/appVersion: ${RELEASE_VERSION}/" "$chart"
        grep -qx "version: ${next}" "$chart"
        grep -qx "appVersion: ${RELEASE_VERSION}" "$chart"
        docker run --rm -v "$PWD:/helm-docs" -u "$(id -u):$(id -g)" jnorwood/helm-docs:v1.14.2
    # `secrets: inherit` doesn't cross organizations (template lives in m13tLabs)
    secrets:
      CI_PRIVATE_KEY: ${{ secrets.CI_PRIVATE_KEY }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

  # Built from the release commit: the draft release has no tag yet.
  publish:
    name: Publish npm package and Helm chart
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing / provenance
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.release_sha }}

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Publish npm package
        run: npm publish

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Package Helm chart
        run: |
          helm lint charts/keycloak-reporter
          helm package charts/keycloak-reporter

      - name: Push Helm chart to GHCR
        env:
          CT_OCI_GITHUB_TOKEN: ${{ secrets.CT_OCI_GITHUB_TOKEN }}
        run: |
          echo "$CT_OCI_GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for pkg in keycloak-reporter-*.tgz; do
            helm push "$pkg" oci://ghcr.io/cloudtooling/helm-charts
          done
